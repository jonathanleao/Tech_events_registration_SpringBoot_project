spring:
  application:
    name: techEventsRegistration

  datasource:
    url: jdbc:mysql://host.docker.internal:3306/tech_events?createDatabaseIfNotExist=true
    username: yourUser
    password: yourPassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    addresses: cloud_amqp_url

broker:
  queue:
    participant-created: participant.email
    enrollment-created: enrollment.email

jwt:
  secret: secret_key
  expiration: expiration_Time_In_Milli_Seconds