spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tech_events?createDatabaseIfNotExist=true
    username: your_username
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    addresses: your_cloud_adrees

broker:
  queue:
    name: queue_name

jwt:
  secret: secret_key
  expiration: expiration_Time_In_Milli_Seconds